<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Aquarium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#020813;color:#fff}
#bg{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,30,60,.15),rgba(0,10,25,.25)),url('sfondo.jpg') center bottom/cover}
.rays{position:fixed;inset:-20%;z-index:2;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0,rgba(255,255,255,.08) 4%,transparent 8%,transparent 16%);animation:rays 16s ease-in-out infinite alternate}
@keyframes rays{from{transform:translateX(-3%) rotate(-6deg)}to{transform:translateX(3%) rotate(-10deg)}}
.air{position:fixed;bottom:-20px;z-index:2;border-radius:50%;border:1px solid rgba(255,255,255,.45);animation:up linear infinite;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh)}}
#tank{position:fixed;inset:0;z-index:3;overflow:hidden}
.fish{position:absolute;left:0;top:0;will-change:transform;cursor:pointer}
.fish img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.bubble{position:absolute;bottom:100%;left:50%;width:max-content;max-width:210px;transform:translateX(-50%) scale(.85);padding:8px 12px;border-radius:14px;background:#fff;color:#0b1a28;font-size:.85rem;font-weight:500;line-height:1.25;text-align:center;opacity:0;transition:.25s;pointer-events:none;z-index:5}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
#cleaner{position:fixed;bottom:0;left:50%;height:70vh;z-index:6;transform:translateX(-50%);opacity:0;transition:opacity .6s;pointer-events:none}
#cleaner.on{opacity:1}
#cleaner img{height:100%;width:auto;display:block}
#cleaner .bubble{bottom:auto;top:4%;left:80%}
.ui{position:fixed;inset:0;z-index:4;pointer-events:none;display:flex;justify-content:space-between;padding:40px 50px}
.glass{background:rgba(10,22,34,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.clock{padding:26px 36px;height:max-content}
#hm{font-size:5rem;font-weight:700;line-height:1;letter-spacing:-2px;text-shadow:0 4px 20px rgba(0,0,0,.35)}
#sec{font-size:1.6rem;font-weight:300;opacity:.7;margin-left:6px;letter-spacing:0}
#date{font-size:1.3rem;font-weight:300;opacity:.9;margin-top:10px;text-transform:capitalize}
.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:7;font-size:.8rem;opacity:.7;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:20px;transition:opacity 1s;pointer-events:none}
.decor{position:fixed;inset:0;pointer-events:none}#decorBack{z-index:2}#decorFront{z-index:4}.decor img{position:absolute;height:auto}
#mbtn,#nbtn{position:fixed;right:18px;bottom:16px;z-index:8;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,22,34,.6);color:#fff;font-size:1.2rem;cursor:pointer}
#nbtn{right:70px}
.clock{pointer-events:auto;cursor:pointer}
.fx{position:absolute;font-size:2rem;line-height:1;pointer-events:none;z-index:4;animation:fxup 2.8s ease-out forwards}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.1)}}
.egg{position:absolute;line-height:1;pointer-events:none;z-index:2;will-change:transform;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.food{position:absolute;width:8px;height:8px;border-radius:50%;background:#e9b872;z-index:2;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(var(--d));opacity:.2}}
#attack{position:fixed;top:12%;height:70vh;z-index:7;translate:-50% 0;pointer-events:none;animation:splat .35s cubic-bezier(.2,1.6,.4,1) both,wob 1.2s ease-in-out .5s infinite alternate}
#attack img{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
#attack .bubble{bottom:auto;top:-6%}
#attack.out{animation:outa .8s forwards}
@keyframes splat{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes outa{to{opacity:0;transform:scale(.9) translateY(30px)}}
.sfx{position:fixed;top:14%;z-index:8;translate:-50% 0;font:900 6rem 'Hiragino Sans','Noto Sans JP',sans-serif;color:#fff;-webkit-text-stroke:3px #e91e63;text-shadow:0 6px 0 #e91e63;pointer-events:none;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg);opacity:0}15%{transform:scale(1.2) rotate(4deg);opacity:1}100%{transform:scale(1);opacity:0}}
#tank.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,-2px)}}
.rise{position:fixed;bottom:0;height:55vh;z-index:5;translate:-50% 0;pointer-events:none;animation:rise 1.6s ease-out both}
.rise img{height:100%;width:auto;display:block}
.rise.out{animation:sink 1.4s ease-in forwards}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes sink{to{transform:translateY(105%)}}
.heart{position:fixed;z-index:6;font-size:2rem;pointer-events:none;animation:hrt 3.2s ease-out forwards}
@keyframes hrt{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-45vh) scale(1.2)}}
.school{position:absolute;left:0;pointer-events:none;z-index:2}
.school img{position:absolute;height:auto;animation:sw 3s ease-in-out infinite alternate}
@keyframes sw{to{transform:translateY(10px)}}
.luca{position:fixed;z-index:4;height:36vh;translate:-50% 0;pointer-events:none;opacity:0;transition:opacity 1.5s}
.luca.on{opacity:1}
.luca img{height:100%;width:auto;display:block}
.sheep{position:absolute;left:0;top:0;height:auto;pointer-events:none;z-index:2;transition:transform 1.8s linear,opacity 1.2s}
.zone{position:fixed;left:0;right:0;z-index:9;pointer-events:none;background:rgba(0,200,255,.15);border:1px dashed #0ff}
@media(max-width:900px){.ui{padding:20px}#hm{font-size:3.4rem}}
@media(prefers-reduced-motion:reduce){.rays,.air{animation:none}}
</style>
</head>
<body>
<div id="bg"></div><div class="rays"></div>
<div class="decor" id="decorBack"></div>
<div id="tank"></div>
<div class="decor" id="decorFront"></div>
<div id="cleaner"><img src="salvatore-pulisce.png" alt="Salvatore pulisce"><div class="bubble"></div></div>
<div class="ui">
  <div class="glass clock"><div><span id="hm"></span><span id="sec"></span></div><div id="date"></div></div>
</div>
<div class="hint" id="hint">Tocca lo schermo per attivare l'audio · tocca un pesce per farlo parlare · tocca l'orologio per dare da mangiare</div>
<button id="mbtn" title="Musica">🎵</button><button id="nbtn" title="Brano successivo">⏭</button>
<script src="frasi.js"></script>
<script>
const $ = s => document.querySelector(s);
const pick = a => a && a.length ? a[Math.floor(Math.random() * a.length)] : null;
const rnd = (a, b) => a + Math.random() * (b - a);

/* Orologio */
function tick() {
  const d = new Date();
  $('#hm').textContent = d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'});
  $('#sec').textContent = String(d.getSeconds()).padStart(2, '0');
  $('#date').textContent = d.toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long'});
}
setInterval(tick, 1000); tick();

/* Bolle d'aria */
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div'), s = rnd(6, 20);
  b.className = 'air';
  b.style.cssText = `left:${rnd(0, 100)}%;width:${s}px;height:${s}px;animation-duration:${rnd(9, 22)}s;animation-delay:${-rnd(0, 20)}s`;
  document.body.appendChild(b);
}

/* Audio: rumore dello spray */
let ac;
addEventListener('pointerdown', () => {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  $('#hint').style.opacity = 0;
}, {once: false});
function spray() {
  if (!ac || ac.state !== 'running') return;
  for (let i = 0; i < 3; i++) {
    const t = ac.currentTime + i * .4, n = Math.floor(ac.sampleRate * .28);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let j = 0; j < n; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / n, 1.5);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = 2800; g.gain.value = .4;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
}

/* ====== IMPOSTAZIONI (modificale qui) ====== */
// Zone dello schermo (da 0 a 1, dall'alto in basso). Aggiungi ?debug alla fine del link per vederle colorate.
const ZONE = {
  waterTop: .10, waterBottom: .72,   // dove nuotano i pesci
  floorTop: .80, floorBottom: .96    // la ghiaia: dove camminano Ciccio, la Modus e la bici
};
// Decorazioni GIF/PNG: layer 'back' = dietro ai pesci, 'front' = davanti. x e bottom in % o px, w = larghezza in px.
const DECOR = [
  // { src: 'alga.gif', x: '8%', bottom: '0%', w: 180, layer: 'front' },
  // { src: 'corallo.gif', x: '60%', bottom: '2%', w: 220, layer: 'back' },
];
// Musica di sottofondo: playlist in ordine (i brani si ripetono). 'egg' parte solo ogni tanto, quando passa il sindaco in bici
const MUSIC = { tracks: ['ambiente.mp3', 'aquarium.mp3', 'comfort.mp3', 'minecraft.mp3'], egg: 'montagna.mp3', volume: .3 };
/* ============================================ */

DECOR.forEach(d => {
  const i = document.createElement('img');
  i.src = d.src; i.style.cssText = `left:${d.x};bottom:${d.bottom || '0'};width:${d.w}px`;
  $(d.layer === 'front' ? '#decorFront' : '#decorBack').appendChild(i);
});
if (location.search.includes('debug')) [[ZONE.waterTop, ZONE.waterBottom], [ZONE.floorTop, ZONE.floorBottom]].forEach(([a, b]) => {
  const z = document.createElement('div'); z.className = 'zone';
  z.style.top = a * 100 + '%'; z.style.height = (b - a) * 100 + '%'; document.body.appendChild(z);
});
const mus = new Audio(), mb = $('#mbtn'); let musOff = false, ti = 0;
mus.volume = MUSIC.volume;
const nextTrack = () => { if (!MUSIC.tracks.length) return; mus.src = MUSIC.tracks[ti++ % MUSIC.tracks.length]; mus.play().catch(() => {}); };
mus.onended = nextTrack;
addEventListener('pointerdown', e => { if (e.target.id !== 'mbtn' && e.target.id !== 'nbtn' && !musOff && !mus.src) nextTrack(); });
mb.onclick = () => { if (!mus.src) { musOff = false; nextTrack(); } else if (mus.paused) { musOff = false; mus.play().catch(() => {}); mb.textContent = '🎵'; } else { musOff = true; mus.pause(); mb.textContent = '🔇'; } };
$('#nbtn').onclick = () => { musOff = false; mb.textContent = '🎵'; nextTrack(); };

/* Personaggi */
const SC = Math.max(.6, Math.min(1, innerWidth / 1000));
const CH = {
  giulia:   {img: 'giulia.png',   w: 130, face: 'L', speed: 1.6},
  salvatore:{img: 'salvatore.png',w: 115, face: 'L', speed: .7},
  ciccio:   {img: 'ciccio.png',   w: 110, face: null, speed: .9},
  nemesi:   {img: 'nemesi.png',   w: 150, face: 'R', speed: 1.1},
  alessia:  {img: 'alessia.png',  w: 150, face: null, speed: .9},
  maura:    {img: 'maura.png',    w: 165, face: 'R', speed: 1.3},
  marco:    {img: 'marco.png',    w: 140, face: 'L', speed: 1.8},
  alessandro: {img: 'alessandro.png', w: 70, face: null, speed: .6},
  nino:     {img: 'nino.png',     w: 105, face: 'L', speed: .8},
  gullotta: {img: 'gullotta.png', w: 150, face: 'L', speed: 4}
};
const W = () => innerWidth, H = () => innerHeight;
const F = {};

function say(f, txt, ms = 3600) {
  if (!txt || f.mode === 'away') return;
  f.b.textContent = txt; f.b.classList.add('on');
  clearTimeout(f.bt); f.bt = setTimeout(() => f.b.classList.remove('on'), ms);
}
const hh = f => f.el.offsetHeight || f.w * .9;
const water = f => { const a = ZONE.waterTop * H(); return rnd(a, Math.max(a + 1, ZONE.waterBottom * H() - hh(f))); };
const floor = f => rnd(ZONE.floorTop * H(), ZONE.floorBottom * H()) - hh(f);
function target(f) {
  const w = f.w; f.grounded = false;
  if (f.k === 'gullotta') {
    const fromL = Math.random() < .5, onFloor = Math.random() < .5, y = onFloor ? floor(f) : water(f);
    f.grounded = onFloor;
    f.x = fromL ? -w - 40 : W() + 40; f.y = y; f.tx = fromL ? W() + 40 : -w - 40; f.ty = y;
    f.dashing = true; say(f, pick(FRASI.gullotta.sindaco), 2600); if (Math.random() < .12) chase();
  } else if (f.k === 'nemesi') {
    if (f.modus) { f.tx = rnd(20, Math.max(40, W() - w - 20)); f.ty = floor(f); f.grounded = true; return; }
    const c = F.ciccio, a = ZONE.waterTop * H(), b = Math.max(a + 40, ZONE.waterBottom * H() - hh(f));
    f.tx = Math.max(10, Math.min(W() - w - 10, c.x + rnd(-150, 150)));
    f.ty = f.low ? rnd(a, a + (b - a) * .25) : rnd(b - (b - a) * .25, b); f.low = !f.low;
  } else if (f.k === 'nino') {
    f.grounded = true; f.ty = floor(f);
    f.tx = f.leaving ? (f.dirOut > 0 ? W() + 80 : -w - 80) : rnd(W() * .15, W() * .85);
  } else if (f.k === 'ciccio' || f.k === 'alessandro') {
    f.tx = rnd(20, Math.max(40, W() - w - 20)); f.ty = floor(f); f.grounded = true;
  } else if (f.k === 'maura' && Math.random() < .45) {
    const a = F.alessia; f.tx = Math.max(10, Math.min(W() - w - 10, a.x + rnd(-130, 130))); f.ty = water(f);
  } else {
    f.tx = rnd(20, Math.max(40, W() - w - 20)); f.ty = water(f);
  }
}
function hold(f, t, ms) { f.mode = 'stop'; f.until = t + ms; }
function arrive(f, t) {
  const k = f.k, R = Math.random();
  if (f.chill) { hold(f, t, 1e9); return; }
  if (k === 'gullotta') { f.dashing = false; f.x = -999; hold(f, t, rnd(120000, 240000)); return; }
  if (k === 'giulia') {
    if (R < .35) { say(f, pick(FRASI.giulia.mail)); hold(f, t, 3500); return; }
    if (R < .75) say(f, pick(FRASI.giulia.normali));
  } else if (k === 'salvatore') {
    if (R < .35) { f.mode = 'sleep'; f.until = t + rnd(9000, 13000); f.talk = t + 2500; say(f, 'Zzz...', 2000); return; }
  } else if (k === 'ciccio') {
    if (R < .4) { say(f, pick(FRASI.ciccio.cavi)); hold(f, t, 3500); return; }
    if (R < .55) say(f, pick(FRASI.ciccio.xfactor));
  } else if (k === 'marco') {
    if (R < .45) { say(f, pick(FRASI.marco.matto)); if (R < .2) fx(f, '💥'); }
  } else if (k === 'alessandro') {
    if (R < .4) { say(f, pick(FRASI.alessandro.spiegoni), 5000); hold(f, t, 5000); return; }
  } else if (k === 'nino') {
    if (f.leaving) { f.mode = 'away'; f.leaving = false; f.el.style.visibility = 'hidden'; return; }
    if (R < .5) say(f, pick(FRASI.nino.pascolo));
  } else if (k === 'alessia') {
    if (R < .25) { say(f, pick(FRASI.alessia.cucina)); hold(f, t, 3500); return; }
    if (R < .55) say(f, pick(FRASI.alessia.giapponese));
  } else if (k === 'maura') {
    if (R < .3) { f.dog = !f.dog; f.img.src = f.dog ? 'maura-summer.png' : 'maura.png'; say(f, pick(f.dog ? FRASI.maura.summerOn : FRASI.maura.summerOff), 3500); }
    else if (R < .5) say(f, pick(FRASI.maura.normali));
  } else if (k === 'nemesi') {
    if (f.modus) { target(f); return; }
    if (R < .12) { goModus(f, t); return; }
    if (R < .45) say(f, pick(FRASI.nemesi.occhi));
    else if (R < .75) say(f, pick(FRASI.nemesi.conCiccio));
    hold(f, t, rnd(800, 2000));
  }
  target(f);
}
function goModus(f, t) {
  f.modus = true; f.mUntil = t + 9000; f.img.src = 'nemesi-modus.png'; f.w = 190 * SC; f.el.style.width = f.w + 'px';
  say(f, pick(FRASI.nemesi.modus) || pick(FRASI.nemesi.preferita) || 'Vroom vroom!', 4500);
  f.mode = 'swim'; target(f);
}
function backFromModus(f) {
  f.modus = false; f.img.src = 'nemesi.png'; f.w = CH.nemesi.w * SC; f.el.style.width = f.w + 'px';
}

function make(k) {
  const c = CH[k], el = document.createElement('div');
  el.className = 'fish'; el.style.width = c.w * SC + 'px';
  el.innerHTML = '<img src="' + c.img + '" alt="' + k + '"><div class="bubble"></div>';
  $('#tank').appendChild(el);
  const f = {k, c, el, img: el.firstChild, b: el.lastChild, w: c.w * SC, x: rnd(60, W() - 260), y: rnd(130, H() - 260),
    dir: 1, mode: 'swim', until: 0, bt: 0, ph: rnd(0, 6), cd: 0};
  F[k] = f; target(f); if (k !== 'gullotta') { f.x = f.tx; f.y = f.ty; target(f); }
  el.onclick = () => {
    const L = FRASI[k];
    say(f, pick(L.click ? L.click : k === 'gullotta' ? L.sindaco : k === 'giulia' ? L.normali : k === 'salvatore' ? L.incontro : k === 'ciccio' ? L.xfactor : L.conCiccio));
  };
  return f;
}
Object.keys(CH).forEach(make);
F.gullotta.x = -999; hold(F.gullotta, 0, 90000); F.nino.mode = 'away'; F.nino.el.style.visibility = 'hidden';

/* Movimento */
let last = performance.now();
function loop(t) {
  const k60 = Math.min(3, (t - last) / 16.7); last = t;
  for (const key in F) {
    const f = F[key];
    if (f.mode === 'away') continue;
    if (f.modus && t > f.mUntil) { backFromModus(f); target(f); }
    if (f.mode === 'stop' || f.mode === 'sleep') {
      if (f.mode === 'sleep' && t > f.talk) { say(f, pick(FRASI.salvatore.sonno)); f.talk = t + rnd(3000, 4500); }
      if (t > f.until) {
        if (f.modus) backFromModus(f);
        f.mode = 'swim'; target(f);
      }
    } else {
      const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy);
      if (d < 8) arrive(f, t);
      else {
        const sp = f.c.speed * (f.modus ? 2 : 1) * (window.NIGHT ? .4 : 1) * (t < (f.fleeUntil || 0) ? 3 : 1) * k60;
        f.x += dx / d * sp; f.y += dy / d * sp;
        if (Math.abs(dx) > 2) f.dir = dx > 0 ? 1 : -1;
      }
    }
    const bob = f.grounded ? Math.sin(t / 90 + f.ph) * 1.5 : Math.sin(t / 700 + f.ph) * (f.mode === 'sleep' ? 9 : 5);
    f.el.style.transform = `translate(${f.x}px,${f.y + bob}px)`;
    const flip = f.c.face && !f.chill && ((f.dir > 0 && f.c.face === 'L') || (f.dir < 0 && f.c.face === 'R'));
    f.img.style.transform = flip ? 'scaleX(-1)' : '';
    const sk = SKIN[f.k]; if (sk) { const w = sk(f); if (f.cur !== w) { f.cur = w; f.img.src = w; } }
    f.img.style.opacity = 1;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* Incontri tra pesci */
const near = (a, b, d) => Math.abs(a.x - b.x) < d && Math.abs(a.y - b.y) < d;
setInterval(() => {
  const now = Date.now(), g = F.gullotta, s = F.salvatore, c = F.ciccio, n = F.nemesi;
  if (g.dashing) {
    for (const k of ['giulia', 'salvatore', 'ciccio', 'nemesi']) {
      const o = F[k];
      if (o.mode !== 'away' && near(g, o, 230) && now > o.cd) { say(o, pick(FRASI.gullotta.insultatoDa)); o.cd = now + 5000; }
    }
    if (Math.random() < .3) say(g, pick(['L\'opposizione!!', 'Le buche!!']), 1800);
  }
  if (near(c, n, 240) && now > c.cd) {
    c.cd = now + 16000;
    say(c, pick(FRASI.ciccio.nemesi));
    setTimeout(() => say(n, pick(FRASI.nemesi.litigio)), 1500);
  }
  if (s.mode === 'swim' && now > s.cd) {
    for (const k of ['giulia', 'ciccio', 'nemesi']) {
      if (F[k].mode !== 'away' && near(s, F[k], 190)) { say(s, pick(k === 'nemesi' && Math.random() < .3 ? FRASI.nemesi.bene : FRASI.salvatore.incontro)); s.cd = now + 12000; break; }
    }
  }
}, 700);

/* Salvatore esce a pulire l'acquario */
function clean() {
  const s = F.salvatore, cl = $('#cleaner'), cb = cl.querySelector('.bubble');

/* ====== NUOVI PERSONAGGI ED EVENTI RARI ====== */
const rare = (fn, min, max, first) => setTimeout(function r() { if (!window.NIGHT) fn(); setTimeout(r, rnd(min, max)); }, first);
function tone(freq, dur, vol = .15) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .5, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
const thud = () => tone(150, .35, .6);
const blip = () => { tone(880, .12, .08); setTimeout(() => tone(1200, .12, .06), 90); };
function urla(txt) {
  if (!('speechSynthesis' in window) || !ac || ac.state !== 'running') return;
  const u = new SpeechSynthesisUtterance(String(txt).split(' (')[0]);
  u.lang = 'ja-JP'; u.rate = 1.15; u.pitch = 1.7; speechSynthesis.cancel(); speechSynthesis.speak(u);
}

}

function chase() {
  if (musOff || !MUSIC.egg || !mus.src || !eggA.paused) return;
  eggA.src = MUSIC.egg; eggA.volume = .3; eggA.play().catch(() => {});
  mus.volume = .04; setTimeout(() => { eggA.pause(); mus.volume = MUSIC.volume; }, 22000);
}

/* IA opzionale */
if (AI_URL) setInterval(async () => {
  try {
    const r = await fetch(AI_URL, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({giorno: new Date().toLocaleDateString('it-IT', {weekday: 'long'}), ora: new Date().toTimeString().slice(0, 5), personaggi: Object.keys(F)})});
    ((await r.json()).battute || []).forEach((b, i) => F[b.chi] && setTimeout(() => say(F[b.chi], b.frase, 4500), i * 3500));
  } catch (e) {}
}, 120000);
